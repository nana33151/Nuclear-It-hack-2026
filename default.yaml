# Person 2 pipeline config. Swap detections.source when Person 1 delivers.

detections:
  source: mock
  path: data/input/detections.jsonl
  mock:
    camera_id: cam_01
    num_frames: 60
    fps: 25
    num_persons: 2
    seed: 42

mot:
  backend: bytetrack
  track_thresh: 0.5
  track_buffer: 30
  match_thresh: 0.8
  frame_rate: 25

reid:
  enabled: true
  backend: solider
  variant: swin_small
  weights: weights/swin_s_market.pth
  semantic_weight: 0.2
  only_usable_for_reid: true
  device: auto

tracklet:
  split_dispersion_threshold: 0.35
  min_frames: 3
  representative: middle

# --- NEW: mirror reflection filter ---
mirror_filter:
  enabled: true
  reject_outside_floor: true
  mirror_margin: 0.25     # meters

output:
  dir: data/output
  tracklets_name: tracklets.jsonl
