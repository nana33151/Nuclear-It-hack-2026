# Demo pipeline config (short window — full videos are ~20 min @ 2.5K)

video_dir: Video
cameras: null  # null = all *.mkv/*.mp4 in video_dir; or list of stems

model: person1/models/yolo11s-seg.pt
device: auto
imgsz: 640
confidence: 0.55
iou: 0.7

# Process only a short slice for a runnable demo
start_sec: 170.0
max_sec: 25.0
stride: 5          # detect every N-th frame
display_max_side: 960
export_mp4: true   # write output/videos/{camera}.mp4 with boxes + IDs

mot:
  track_thresh: 0.4
  track_buffer: 30
  match_thresh: 0.8
  n_init: 3
  min_frames: 3

# ReID: solider (Swin-S Market) or color (mean RGB fallback)
reid:
  enabled: true
  backend: solider          # solider | color
  variant: swin_small       # swin_small | swin_base | swin_tiny
  weights: weights/swin_s_market.pth
  semantic_weight: 0.2
  device: auto

merge:
  T: 8.0
  min_sim: 0.55
  max_transition_time: 12.0
  method: lifecycle
  min_hits: 2
  min_confirm_sec: 0.2
  # Directed transitions: from_cam -> to_cam {min_time, max_time, weight}
  transitions:
    camera_new_1:
      camera_new_2: { min_time: 0.0, max_time: 8.0, weight: 1.0 }
    camera_new_2:
      camera_new_1: { min_time: 0.0, max_time: 8.0, weight: 1.0 }
      camera_new_3: { min_time: 4.0, max_time: 25.0, weight: 0.35 }
    camera_new_3:
      camera_new_5: { min_time: 0.0, max_time: 10.0, weight: 1.0 }
      camera_new_4: { min_time: 0.0, max_time: 8.0, weight: 0.55 }
      camera_new_1: { min_time: 4.0, max_time: 25.0, weight: 0.35 }
      camera_new_2: { min_time: 4.0, max_time: 25.0, weight: 0.35 }
    camera_new_5:
      camera_new_3: { min_time: 0.0, max_time: 10.0, weight: 1.0 }
      camera_new_4: { min_time: 0.0, max_time: 8.0, weight: 0.55 }
    camera_new_4:
      camera_new_3: { min_time: 0.0, max_time: 10.0, weight: 1.0 }
      camera_new_5: { min_time: 0.0, max_time: 10.0, weight: 1.0 }

output_dir: output
tracks_name: tracks.json
overlays_name: overlays.json
